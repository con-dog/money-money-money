<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Household Budget</title>
<style>
  body { font-family: monospace; margin: 12px; }
  table { border-collapse: collapse; margin-bottom: 8px; }
  td, th { border: 1px solid #999; padding: 2px 4px; text-align: left; }
  input[type=number] { width: 80px; }
  .col { display: inline-block; vertical-align: top; border: 2px solid #333; padding: 6px; margin: 4px; }
  .neg { color: #b00; }
  .pos { color: #070; }
  .small { font-size: 0.85em; color: #555; }
  #link { width: 100%; }
  h3 { margin: 4px 0; }
  #qr { margin-top: 6px; }
</style>
</head>
<body>

<h2>Household Budget</h2>

<div>
  View period:
  <select id="period"></select>
  <input type="number" id="customDays" value="90" min="1" max="4095" style="width:70px" disabled>
  &nbsp; Shared net split:
  <select id="split">
    <option value="0">Equal</option>
    <option value="1">Proportional to income</option>
    <option value="2">Custom %</option>
  </select>
  &nbsp; Shared surplus:
  <select id="surplusTo">
    <option value="0">Household bucket</option>
    <option value="1">Distribute to people</option>
  </select>
  &nbsp;&nbsp; <button type="button" id="addPerson">+ Person</button>
  <button type="button" id="reset">Reset</button>
</div>
<div class="small">Everything is stored per week. Amounts are exact to $1 up to $511/wk and to $10 up to $5110/wk (income rounds down, expenses up). Each line is exactly 2 bytes.</div>

<div id="columns"></div>

<h3>Savings forecast for this period</h3>
<table id="forecast"></table>

<h3>Share</h3>
<input type="text" id="link" readonly>
<button type="button" id="copy">Copy link</button>
<span id="linkInfo" class="small"></span>
<div id="qr"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script>
// ---------- constants ----------
const VERSION = 5;
const PERIODS = [['Week', 7], ['Fortnight', 14], ['Month', 30.4375], ['Quarter', 91.3125], ['Year', 365.25], ['Custom days', 0]];
// entry conversion helpers only; everything is stored per week
const CONV = [['/wk', 1], ['/fn', 2], ['/mo', 30.4375 / 7], ['/qtr', 91.3125 / 7], ['/yr', 365.25 / 7]];
const MAX_PEOPLE = 7, MAX_INC = 15, MAX_EXP = 31;

// amount per week, 10 bits: 1 scale bit (x1 or x10) + 9-bit mantissa. Exact to $1 up to $511, to $10 up to $5110.
const AMT_MAX = 5110;
function amtEncode(weekly, roundUp) {
  weekly = Math.min(AMT_MAX, Math.max(0, Number(weekly) || 0));
  const r = v => roundUp ? Math.ceil(v - 1e-9) : Math.floor(v + 1e-9);
  const m1 = r(weekly);
  if (m1 <= 511) return m1;                       // scale 0
  return 512 | Math.min(511, r(weekly / 10));     // scale 1
}
const amtDecode = c => (c & 512) ? (c & 511) * 10 : c;

// tag 0 is always "Other". Max 64 per list (6 bits). [group, name]
const INCOME_TAGS = [['Other', 'Other'], ['Other', 'Other 2'],
  ['Work', 'Salary'], ['Work', 'Wages'], ['Work', 'Bonus'], ['Work', 'Overtime'], ['Work', 'Side hustle'], ['Work', 'Freelance'], ['Work', 'Business'],
  ['Passive', 'Rent received'], ['Passive', 'Board received'], ['Passive', 'Dividends'], ['Passive', 'Interest'],
  ['Other', 'Government payment'], ['Other', 'Child support'], ['Other', 'Pension'], ['Other', 'Scholarship'], ['Other', 'Gift'], ['Other', 'Sale of stuff']];
const EXPENSE_TAGS = [['Other', 'Other'], ['Other', 'Other 2'], ['Other', 'Buffer'],
  ['Housing', 'Rent'], ['Housing', 'Mortgage'], ['Housing', 'Rates'], ['Housing', 'Body corp'], ['Housing', 'Home insurance'], ['Housing', 'Contents insurance'],
  ['Utilities', 'Electricity'], ['Utilities', 'Gas'], ['Utilities', 'Water'], ['Utilities', 'Internet'], ['Utilities', 'Mobile'],
  ['Food', 'Groceries'], ['Food', 'Eating out'], ['Food', 'Coffee'], ['Food', 'Alcohol'], ['Food', 'Takeaway'],
  ['Transport', 'Car loan'], ['Transport', 'Car insurance'], ['Transport', 'Car rego'], ['Transport', 'Fuel'], ['Transport', 'Car maintenance'], ['Transport', 'Public transport'], ['Transport', 'Parking'],
  ['Health', 'Health insurance'], ['Health', 'Doctor'], ['Health', 'Dentist'], ['Health', 'Pharmacy'], ['Health', 'Gym'], ['Health', 'Sport'],
  ['Lifestyle', 'Streaming'], ['Lifestyle', 'Subscriptions'], ['Lifestyle', 'AI tools'], ['Lifestyle', 'Hobbies'], ['Lifestyle', 'Dance classes'], ['Lifestyle', 'Clothes'], ['Lifestyle', 'Haircut'], ['Lifestyle', 'Personal care'], ['Lifestyle', 'Fun money'],
  ['Family', 'Kids'], ['Family', 'Childcare'], ['Family', 'School'], ['Family', 'Pets'], ['Family', 'Vet'], ['Family', 'Gifts'], ['Family', 'Donations'],
  ['Travel', 'Holidays'], ['Travel', 'Flights'], ['Travel', 'Travel savings'],
  ['Home', 'Furniture'], ['Home', 'Appliances'], ['Home', 'Repairs'], ['Home', 'Cleaning'], ['Home', 'Garden'],
  ['Finance', 'Life insurance'], ['Finance', 'Income protection'], ['Finance', 'Credit card'], ['Finance', 'Personal loan'], ['Finance', 'Student loan'], ['Finance', 'Tax'], ['Finance', 'Fees'], ['Finance', 'Investing'], ['Finance', 'Savings transfer']];
const tagIndex = (tags, name) => tags.findIndex(t => t[1] === name);

function tagSelect(tags, val) {
  let html = `<select data-f="tag">`, group = null;
  tags.forEach((t, i) => {
    if (t[0] !== group) { if (group !== null) html += `</optgroup>`; group = t[0]; html += `<optgroup label="${group}">`; }
    html += `<option value="${i}" ${i === val ? 'selected' : ''}>${t[1]}</option>`;
  });
  return html + `</optgroup></select>`;
}

// ---------- state ----------
// lines: {id, owner, tag, code}   weekly amount = amtDecode(code)
let state = defaultState();
function defaultState() {
  return { period: 0, customDays: 90, split: 0, surplusTo: 0,
    people: [{ id: uid(), init: 'AB', pct: 50 }, { id: uid(), init: 'CD', pct: 50 }], incomes: [], expenses: [] };
}
function uid() { return Math.random().toString(36).slice(2, 7); }
function pname(p) { const same = state.people.filter(q => q.init === p.init); const k = same.indexOf(p); return p.init + (k > 0 ? `(${k})` : ''); }
const cleanInit = s => (s || '').toUpperCase().replace(/[^A-Z]/g, '').slice(0, 2);
const lineAmt = it => amtDecode(it.code);
const setLineAmt = (it, weekly, isExp) => { it.code = amtEncode(weekly, isExp); };

// ---------- calc ----------
function periodDays() { return PERIODS[state.period][1] || Math.max(1, Number(state.customDays) || 1); }
const perPeriod = (it, days) => amtDecode(it.code) / 7 * days;

function calc() {
  const days = periodDays();
  const r = {};
  for (const o of ['H', ...state.people.map(p => p.id)]) r[o] = { income: 0, expense: 0 };
  for (const i of state.incomes) if (r[i.owner]) r[i.owner].income += perPeriod(i, days);
  for (const e of state.expenses) if (r[e.owner]) r[e.owner].expense += perPeriod(e, days);

  const totalIncome = state.people.reduce((s, p) => s + r[p.id].income, 0);
  const totalPct = state.people.reduce((s, p) => s + (Number(p.pct) || 0), 0);
  const n = state.people.length, share = {};
  for (const p of state.people) {
    if (state.split === 1) share[p.id] = totalIncome ? r[p.id].income / totalIncome : 1 / n;
    else if (state.split === 2) share[p.id] = totalPct ? (Number(p.pct) || 0) / totalPct : 1 / n;
    else share[p.id] = 1 / n;
  }
  const h = r['H'], hNet = h.income - h.expense, dist = state.surplusTo === 1;
  const out = { days, share, rows: [] };
  for (const p of state.people) {
    const me = r[p.id];
    const take = hNet < 0 || dist ? hNet * share[p.id] : 0;
    out.rows.push({ name: pname(p), ...me, contribH: take, savings: me.income - me.expense + take });
  }
  out.rows.push({ name: 'Household', ...h, contribH: 0, savings: hNet > 0 && !dist ? hNet : 0, isH: true });
  const sum = k => out.rows.reduce((s, x) => s + x[k], 0);
  out.rows.push({ name: 'TOTAL', income: sum('income'), expense: sum('expense'), savings: sum('savings'), isTotal: true });
  return out;
}

// ---------- render ----------
const $ = s => document.querySelector(s);
const fmt = n => (n < 0 ? '-' : '') + Math.abs(n).toFixed(0).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
const cls = n => n < 0 ? 'neg' : 'pos';
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const sel = (f, opts, val) => `<select data-f="${f}">` + opts.map((o, i) => `<option value="${i}" ${i === val ? 'selected' : ''}>${esc(o)}</option>`).join('') + `</select>`;

function lineTable(kind, owner, items, days) {
  const isExp = kind === 'expenses', tags = isExp ? EXPENSE_TAGS : INCOME_TAGS, max = isExp ? MAX_EXP : MAX_INC;
  let html = `<table data-kind="${kind}" data-owner="${owner}"><tr><th>${isExp ? 'Expense' : 'Income'}</th><th>$/week</th><th>entered as</th><th>/period</th><th></th></tr>`;
  for (const it of items) {
    html += `<tr data-id="${it.id}"><td>${tagSelect(tags, it.tag)}</td>
      <td><input type="number" data-f="amt" value="${lineAmt(it)}" min="0" max="${AMT_MAX}" step="${lineAmt(it) > 511 ? 10 : 1}"></td>
      <td>${sel('conv', CONV.map(f => f[0]), 0)}</td>
      <td>${fmt(perPeriod(it, days))}</td>
      <td><button type="button" data-act="del">x</button></td></tr>`;
  }
  return html + `<tr><td colspan="5">${items.length < max ? `<button type="button" data-act="add">+ ${isExp ? 'expense' : 'income'}</button>` : `<span class="small">max ${max}</span>`}</td></tr></table>`;
}

function render() {
  const c = calc(), days = c.days;
  $('#period').value = state.period; $('#customDays').value = state.customDays; $('#customDays').disabled = state.period !== 5;
  $('#split').value = state.split; $('#surplusTo').value = state.surplusTo; 

  let html = '';
  for (const col of [{ id: 'H', name: 'Shared / Household' }, ...state.people.map(p => ({ ...p, name: pname(p) }))]) {
    const isH = col.id === 'H';
    const row = c.rows.find(r => r.name === col.name && !!r.isH === isH) || { income: 0, expense: 0 };
    html += `<div class="col" data-owner="${col.id}"><h3>` +
      (isH ? esc(col.name) : `<input type="text" data-f="pname" maxlength="2" style="width:30px;text-transform:uppercase" value="${esc(col.init)}" title="initials">${col.name.length > 2 ? esc(col.name.slice(2)) : ''} ` +
        (state.split === 2 ? `<input type="number" data-f="pct" value="${col.pct}" min="0" max="100" style="width:50px">% ` : `<span class="small">share ${(c.share[col.id] * 100).toFixed(1)}%</span> `) +
        `<button type="button" data-act="delPerson">x</button>`) + `</h3>` +
      lineTable('incomes', col.id, state.incomes.filter(i => i.owner === col.id), days) +
      lineTable('expenses', col.id, state.expenses.filter(e => e.owner === col.id), days) +
      `<div>Income ${fmt(row.income)} &minus; expenses ${fmt(row.expense)} = <b class="${cls(row.income - row.expense)}">${fmt(row.income - row.expense)}</b></div>` +
      (!isH && row.contribH ? `<div class="small">Share of household net: <span class="${cls(row.contribH)}">${fmt(row.contribH)}</span></div>` : '') + `</div>`;
  }
  $('#columns').innerHTML = html;

  let f = `<tr><th>Bucket</th><th>Income</th><th>Expenses</th><th>Household share</th><th>Savings</th></tr>`;
  for (const r of c.rows) f += `<tr${r.isTotal ? ' style="font-weight:bold"' : ''}><td>${esc(r.name)}</td><td>${fmt(r.income)}</td><td>${fmt(r.expense)}</td>` +
    `<td>${r.isTotal || r.isH ? '' : fmt(r.contribH)}</td><td class="${cls(r.savings)}">${fmt(r.savings)}</td></tr>`;
  $('#forecast').innerHTML = f;
  updateLink();
}

// ---------- events ----------
document.body.addEventListener('input', e => {
  const t = e.target, f = t.dataset.f; if (!f) return;
  if (f === 'pname' || f === 'pct') {
    const p = state.people.find(p => p.id === t.closest('.col').dataset.owner);
    if (f === 'pname') { p.init = cleanInit(t.value); updateLink(); return; }
    p.pct = Number(t.value); render(); return;
  }
  const tr = t.closest('tr'), table = t.closest('table'), kind = table.dataset.kind;
  const item = state[kind].find(x => x.id === tr.dataset.id); if (!item) return;
  if (f === 'amt') { item._raw = Number(t.value); return; } // commit on change
  if (f === 'conv') return;
  item[f] = Number(t.value);
  render();
});
document.body.addEventListener('change', e => {
  const t = e.target, f = t.dataset.f;
  if (f === 'amt' || f === 'conv') {
    const tr = t.closest('tr'), table = t.closest('table'), kind = table.dataset.kind;
    const item = state[kind].find(x => x.id === tr.dataset.id); if (!item) return;
    // amount typed is interpreted at the "entered as" unit, converted to weekly, then snapped
    const raw = Number(tr.querySelector('[data-f=amt]').value) || 0, conv = CONV[Number(tr.querySelector('[data-f=conv]').value)][1];
    setLineAmt(item, raw / conv, kind === 'expenses'); delete item._raw;
    render();
  } else if (f === 'pname') render();
});

document.body.addEventListener('click', e => {
  const act = e.target.dataset.act; if (!act) return;
  if (act === 'add') {
    const table = e.target.closest('table');
    state[table.dataset.kind].push({ id: uid(), owner: table.dataset.owner, tag: 2, code: 0 });
  } else if (act === 'del') {
    const table = e.target.closest('table'), tr = e.target.closest('tr');
    state[table.dataset.kind] = state[table.dataset.kind].filter(x => x.id !== tr.dataset.id);
  } else if (act === 'delPerson') {
    const id = e.target.closest('.col').dataset.owner;
    if (!confirm('Remove this person and all their lines?')) return;
    state.people = state.people.filter(p => p.id !== id);
    state.incomes = state.incomes.filter(i => i.owner !== id);
    state.expenses = state.expenses.filter(x => x.owner !== id);
  }
  render();
});
$('#period').innerHTML = PERIODS.map((p, i) => `<option value="${i}">${p[0]}</option>`).join('');
$('#period').onchange = e => { state.period = Number(e.target.value); render(); };
$('#customDays').oninput = e => { state.customDays = Math.min(4095, Number(e.target.value)); render(); };
$('#split').onchange = e => { state.split = Number(e.target.value); render(); };
$('#surplusTo').onchange = e => { state.surplusTo = Number(e.target.value); render(); };
$('#addPerson').onclick = () => { if (state.people.length >= MAX_PEOPLE) return alert(`Max ${MAX_PEOPLE} people`); state.people.push({ id: uid(), init: 'P' + (state.people.length + 1), pct: 0 }); render(); };
$('#reset').onclick = () => { if (confirm('Clear everything?')) { state = defaultState(); render(); } };
$('#copy').onclick = () => navigator.clipboard.writeText($('#link').value).then(() => $('#linkInfo').textContent += ' — copied');

// ---------- bit-packed serialisation ----------
// header: ver4 period3 [days12] split2 surplus1 npeople3
// per person: initials 10 [pct7]
// per owner (H, then people in order): ninc4, lines; nexp5, lines
// line: tag6 code10 (scale1 + mantissa9) = 16 bits exactly
class BitWriter {
  constructor() { this.bits = []; }
  w(val, n) { for (let i = n - 1; i >= 0; i--) this.bits.push((val >> i) & 1); }
  init(s) { s = cleanInit(s); for (let i = 0; i < 2; i++) this.w(s[i] ? s.charCodeAt(i) - 65 : 26, 5); }
  bytes() { const out = new Uint8Array(Math.ceil(this.bits.length / 8)); this.bits.forEach((b, i) => { out[i >> 3] |= b << (7 - (i & 7)); }); return out; }
}
class BitReader {
  constructor(bytes) { this.b = bytes; this.p = 0; }
  r(n) { let v = 0; for (let i = 0; i < n; i++) { const byte = this.b[this.p >> 3] || 0; v = (v << 1) | ((byte >> (7 - (this.p & 7))) & 1); this.p++; } return v >>> 0; }
  init() { let s = ''; for (let i = 0; i < 2; i++) { const c = this.r(5); if (c < 26) s += String.fromCharCode(65 + c); } return s; }
}
function encode(s) {
  const bw = new BitWriter();
  bw.w(VERSION, 4); bw.w(s.period, 3); if (s.period === 5) bw.w(s.customDays, 12);
  bw.w(s.split, 2); bw.w(s.surplusTo, 1);
  bw.w(s.people.length, 3);
  for (const p of s.people) { bw.init(p.init); if (s.split === 2) bw.w(Math.min(100, Math.max(0, Math.round(p.pct) || 0)), 7); }
  const line = it => { bw.w(it.tag, 6); bw.w(it.code, 10); };
  for (const o of ['H', ...s.people.map(p => p.id)]) {
    const inc = s.incomes.filter(i => i.owner === o).slice(0, MAX_INC), exp = s.expenses.filter(e => e.owner === o).slice(0, MAX_EXP);
    bw.w(inc.length, 4); inc.forEach(line); bw.w(exp.length, 5); exp.forEach(line);
  }
  return bw.bytes();
}
function decode(bytes) {
  const br = new BitReader(bytes), s = {};
  const v = br.r(4); if (v !== VERSION) throw new Error('unknown version ' + v);
  s.period = br.r(3); s.customDays = s.period === 5 ? br.r(12) : 90;
  s.split = br.r(2); s.surplusTo = br.r(1);
  const np = br.r(3); s.people = [];
  for (let i = 0; i < np; i++) { const p = { id: uid(), init: br.init(), pct: 0 }; if (s.split === 2) p.pct = br.r(7); s.people.push(p); }
  s.incomes = []; s.expenses = [];
  const line = owner => ({ id: uid(), owner, tag: br.r(6), code: br.r(10) });
  for (const o of ['H', ...s.people.map(p => p.id)]) {
    let n = br.r(4); for (let i = 0; i < n; i++) s.incomes.push(line(o));
    n = br.r(5); for (let i = 0; i < n; i++) s.expenses.push(line(o));
  }
  return s;
}
const b64u = {
  enc: bytes => btoa(String.fromCharCode(...bytes)).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''),
  dec: s => Uint8Array.from(atob(s.replace(/-/g, '+').replace(/_/g, '/')), c => c.charCodeAt(0)),
};

let linkTimer;
function updateLink() {
  save();
  clearTimeout(linkTimer);
  linkTimer = setTimeout(() => {
    const bytes = encode(state), enc = b64u.enc(bytes);
    history.replaceState(null, '', '#' + enc);
    const url = location.href;
    $('#link').value = url;
    const nl = state.incomes.length + state.expenses.length;
    $('#linkInfo').textContent = `${bytes.length} bytes → ${enc.length} chars (${nl} lines × 2 bytes + ${bytes.length - nl * 2} header); full URL ${url.length} chars`;
    try {
      const qr = qrcode(0, 'L'); qr.addData(url, 'Byte'); qr.make();
      $('#qr').innerHTML = qr.createSvgTag({ cellSize: 3, margin: 4 }) + `<div class="small">QR version ${(qr.getModuleCount() - 17) / 4} (${qr.getModuleCount()}×${qr.getModuleCount()})</div>`;
    } catch (e) { $('#qr').innerHTML = `<span class="small">QR unavailable (${esc(e.message)})</span>`; }
  }, 150);
}
function save() { try { localStorage.setItem('budget6', JSON.stringify(state)); } catch {} }

function load() {
  const hash = location.hash.slice(1);
  if (hash) { try { state = decode(b64u.dec(hash)); return; } catch (e) { alert('Could not read budget from link: ' + e.message); } }
  try { const s = localStorage.getItem('budget6'); if (s) { state = JSON.parse(s); return; } } catch {}
  state = defaultState();
  state.people[0].init = 'MB'; state.people[1].init = 'CT';
  const [m, c] = state.people.map(p => p.id);
  const inc = (owner, tag, amt) => state.incomes.push({ id: uid(), owner, tag: tagIndex(INCOME_TAGS, tag), code: amtEncode(amt, false) });
  const exp = (owner, tag, amt) => state.expenses.push({ id: uid(), owner, tag: tagIndex(EXPENSE_TAGS, tag), code: amtEncode(amt, true) });
  inc(m, 'Salary', 800); inc(c, 'Salary', 2076.88);
  exp('H', 'Groceries', 75); exp('H', 'Electricity', 65); exp('H', 'Water', 0); exp('H', 'Internet', 11.25); exp('H', 'Buffer', 20);
  exp(m, 'Rent', 180); exp(m, 'Gym', 19); exp(m, 'Dance classes', 60); exp(m, 'Streaming', 5); exp(m, 'Pharmacy', 20); exp(m, 'Travel savings', 60); exp(m, 'Public transport', 60); exp(m, 'Fun money', 75);
  exp(c, 'Rent', 300); exp(c, 'Gym', 20); exp(c, 'Fuel', 100); exp(c, 'Streaming', 5); exp(c, 'Pharmacy', 5); exp(c, 'Health insurance', 45); exp(c, 'AI tools', 25); exp(c, 'Fun money', 75);
}
window.addEventListener('hashchange', () => { load(); render(); });
load(); render();
</script>
</body>
</html>
