<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Household Budget</title>
<style>
  html, body { height: 100%; margin: 0; }
  body { font-family: monospace; }
  main { height: 100dvh; overflow-y: auto; scroll-snap-type: y mandatory; }
  .page { height: 100dvh; box-sizing: border-box; scroll-snap-align: start; max-width: 800px; margin: 0 auto; padding: 8px; display: flex; flex-direction: column; }
  .arrow, #down, #up { text-align: center; padding: 4px 0; }
  .arrow button, #down button, #up button { font-size: 1.4em; padding: 2px 30px; }
  table { border-collapse: collapse; margin-bottom: 8px; width: 100%; table-layout: fixed; }
  th.w-amt { width: 84px; } th.w-conv { width: 92px; } th.w-del { width: 34px; } th.w-wk { width: 30%; } th.w-pct { width: 64px; }
  td select, td input { width: 100%; box-sizing: border-box; }
  .sheet { flex: 1; min-height: 0; overflow-y: auto; }
  .summary { border-top: 1px solid #999; padding-top: 4px; }
  .splitopts { display: grid; grid-template-columns: auto auto 1fr; column-gap: 8px; row-gap: 4px; align-items: center; margin: 4px 0 8px; }
  .splitopts label { margin: 0; }
  .tagcell { display: flex; align-items: center; gap: 4px; }
  .gi { font-size: 1.25em; line-height: 1; color: #000; width: 1.3em; text-align: center; flex: none; }
  .tagcell select { flex: 1; min-width: 0; }
  td, th { border: 1px solid #999; padding: 2px 4px; text-align: left; }
  select { max-width: 100%; }
  @media (max-width: 360px) {
    .page { padding: 4px; }
    body { font-size: 12px; }
    th.w-amt { width: 64px; } th.w-conv { width: 70px; } th.w-del { width: 28px; } th.w-pct { width: 52px; }
    td, th { padding: 1px 2px; }
    .col { padding: 4px; }
  }
  .neg { color: #b00; }
  .pos { color: #070; }
  .small { font-size: 0.85em; color: #555; }
  h3 { margin: 4px 0; }
  #share { text-align: center; }
  #qr svg { max-width: 90vw; max-height: 60vh; height: auto; }
  #share button { font-size: 1.2em; padding: 6px 24px; }
  #qr svg { display: block; margin: 0 auto; }
  #incoming { border: 2px solid #b00; padding: 6px; margin: 8px 0; }
  #track { flex: 1; min-height: 0; display: flex; align-items: stretch; overflow-x: auto; scroll-snap-type: x mandatory; gap: 8px; scrollbar-width: none; }
  #track::-webkit-scrollbar { display: none; }
  .col { flex: 0 0 100%; min-height: 0; display: flex; flex-direction: column; scroll-snap-align: start; box-sizing: border-box; border: 3px solid #333; padding: 6px; }
  .tabs { display: flex; gap: 4px; margin: 6px 0; }
  .tabs button { flex: 1; padding: 4px; }
  .tabs button.on { background: #333; color: #fff; }
  #pos { text-align: center; padding-top: 4px; }
  #nav { display: flex; justify-content: space-between; align-items: center; margin: 6px 0; }
  #bottom { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; }
</style>
</head>
<body>
<main>
<section class="page" id="page1">

<div id="incoming" hidden></div>

<div id="nav">
  <button type="button" id="prev">&larr;</button>
  <button type="button" id="addPerson" title="add person">+</button>
  <button type="button" id="next">&rarr;</button>
</div>
<div id="track"></div>
<div id="pos"></div>
<div id="down"><button type="button" id="downBtn" title="forecast">&darr;</button></div>

</section>
<section class="page" id="page2">
<div id="up"><button type="button" id="upBtn" title="entries">&uarr;</button></div>

<div id="bottom">
  View: <select id="period"></select>

</div>

<table id="forecast"></table>
<div id="down2" class="arrow" style="margin-top:auto"><button type="button" id="downBtn2" title="share">&darr;</button></div>

</section>
<section class="page" id="page3">
<div id="up2" class="arrow"><button type="button" id="upBtn2" title="forecast">&uarr;</button></div>

<div id="share" style="margin:auto 0">
  <div id="qr"></div>
  <button type="button" id="shareBtn">SHARE</button>
  <div id="shareMsg" class="small">&nbsp;</div>
</div>

</section>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script>
// ---------- constants ----------
const VERSION = 12;
const PERIODS = [['Week', 7], ['Fortnight', 14], ['Month', 30.4375], ['Quarter', 91.3125], ['Half year', 182.625], ['Year', 365.25]];
// entry conversion helpers only; everything is stored per week
const CONV = [['/wk', 1], ['/fn', 2], ['/mo', 30.4375 / 7], ['/qtr', 91.3125 / 7], ['/yr', 365.25 / 7]];
const MAX_PEOPLE = 8, MAX_INC = 15, MAX_EXP = 31, MAX_GOAL = 7;
// colour is assigned by position: person 1 is always Blue, person 2 Purple, ...
const COLOURS = [['Blue', '#1e88e5'], ['Purple', '#8e24aa'], ['Green', '#43a047'], ['Orange', '#fb8c00'], ['Red', '#e53935'], ['Teal', '#00897b'], ['Pink', '#d81b60'], ['Yellow', '#fdd835']];

// amount per week, 10 bits: 1 scale bit (x1 or x10) + 9-bit mantissa. Exact to $1 up to $511, to $10 up to $5110.
const AMT_MAX = 5110;
function amtEncode(weekly, roundUp) {
  weekly = Math.min(AMT_MAX, Math.max(0, Number(weekly) || 0));
  const r = v => roundUp ? Math.ceil(v - 1e-9) : Math.floor(v + 1e-9);
  const m1 = r(weekly);
  if (m1 <= 511) return m1;                       // scale 0
  return 512 | Math.min(511, r(weekly / 10));     // scale 1
}
const amtDecode = c => (c & 512) ? (c & 511) * 10 : c;
// goal target, 10 bits: scale bit (x10 or x100) + 9-bit mantissa. $10 steps to $5110, $100 steps to $51,100. Rounds up.
const GOAL_MAX = 51100;
function goalEncode(v) { v = Math.min(GOAL_MAX, Math.max(0, Number(v) || 0)); const m = Math.ceil(v / 10 - 1e-9); return m <= 511 ? m : 512 | Math.min(511, Math.ceil(v / 100 - 1e-9)); }
const goalDecode = c => (c & 512) ? (c & 511) * 100 : c * 10;

// tag 0 is always "Other". Max 64 per list (6 bits). [group, name]
const INCOME_TAGS = [['Other', 'Other'], ['Other', 'Other 2'],
  ['Work', 'Salary'], ['Work', 'Wages'], ['Work', 'Bonus'], ['Work', 'Overtime'], ['Work', 'Side hustle'], ['Work', 'Freelance'], ['Work', 'Business'],
  ['Passive', 'Rent received'], ['Passive', 'Board received'], ['Passive', 'Dividends'], ['Passive', 'Interest'],
  ['Other', 'Government payment'], ['Other', 'Child support'], ['Other', 'Pension'], ['Other', 'Scholarship'], ['Other', 'Gift'], ['Other', 'Sale of stuff']];
const EXPENSE_TAGS = [['Other', 'Other'], ['Other', 'Other 2'], ['Other', 'Buffer'],
  ['Housing', 'Rent'], ['Housing', 'Mortgage'], ['Housing', 'Rates'], ['Housing', 'Body corp'], ['Housing', 'Home insurance'], ['Housing', 'Contents insurance'],
  ['Utilities', 'Electricity'], ['Utilities', 'Gas'], ['Utilities', 'Water'], ['Utilities', 'Internet'], ['Utilities', 'Mobile'],
  ['Food', 'Groceries'], ['Food', 'Eating out'], ['Food', 'Coffee'], ['Food', 'Alcohol'], ['Food', 'Takeaway'],
  ['Transport', 'Car loan'], ['Transport', 'Car insurance'], ['Transport', 'Car rego'], ['Transport', 'Fuel'], ['Transport', 'Car maintenance'], ['Transport', 'Public transport'], ['Transport', 'Parking'],
  ['Health', 'Health insurance'], ['Health', 'Doctor'], ['Health', 'Dentist'], ['Health', 'Pharmacy'], ['Health', 'Gym'], ['Health', 'Sport'],
  ['Lifestyle', 'Streaming'], ['Lifestyle', 'Subscriptions'], ['Lifestyle', 'AI tools'], ['Lifestyle', 'Hobbies'], ['Lifestyle', 'Dance classes'], ['Lifestyle', 'Clothes'], ['Lifestyle', 'Haircut'], ['Lifestyle', 'Personal care'], ['Lifestyle', 'Fun money'],
  ['Family', 'Kids'], ['Family', 'Childcare'], ['Family', 'School'], ['Family', 'Pets'], ['Family', 'Vet'], ['Family', 'Gifts'], ['Family', 'Donations'],
  ['Travel', 'Holidays'], ['Travel', 'Flights'], ['Travel', 'Travel savings'],
  ['Home', 'Furniture'], ['Home', 'Appliances'], ['Home', 'Repairs'], ['Home', 'Cleaning'], ['Home', 'Garden'],
  ['Finance', 'Life insurance'], ['Finance', 'Income protection'], ['Finance', 'Credit card'], ['Finance', 'Personal loan'], ['Finance', 'Student loan'], ['Finance', 'Tax'], ['Finance', 'Fees'], ['Finance', 'Investing'], ['Finance', 'Savings transfer']];
const GOAL_TAGS = [['Other', 'Other'], ['Other', 'Other 2'],
  ['Safety', 'Emergency fund'], ['Safety', 'Debt payoff'],
  ['Big', 'House deposit'], ['Big', 'Car'], ['Big', 'Wedding'], ['Big', 'Renovation'], ['Big', 'Investment'],
  ['Fun', 'Holiday'], ['Fun', 'Tech'], ['Fun', 'Furniture'], ['Fun', 'Hobby gear'],
  ['Life', 'Education'], ['Life', 'Baby'], ['Life', 'Moving'], ['Life', 'Gift']];
const tagIndex = (tags, name) => tags.findIndex(t => t[1] === name);
// monochrome text glyphs (U+FE0E forces text presentation where a font would otherwise pick the colour emoji)
const GROUP_ICON = { Other: '·', Work: '⚙\uFE0E', Passive: '%', Housing: '⌂', Utilities: '⚡\uFE0E', Food: '☕\uFE0E', Transport: '⛽\uFE0E', Health: '✚', Lifestyle: '♫', Family: '☺\uFE0E', Travel: '✈\uFE0E', Home: '⚒\uFE0E', Finance: '⚖\uFE0E', Safety: '☂\uFE0E', Big: '▲', Fun: '★', Life: '✿' };
const groupIcon = (tags, i) => `<span class="gi" title="${tags[i][0]}">${GROUP_ICON[tags[i][0]] || '▫'}</span>`;

function tagSelect(tags, val) {
  let html = `<select data-f="tag">`, group = null;
  tags.forEach((t, i) => {
    if (t[0] !== group) { if (group !== null) html += `</optgroup>`; group = t[0]; html += `<optgroup label="${group}">`; }
    html += `<option value="${i}" ${i === val ? 'selected' : ''}>${t[1]}</option>`;
  });
  return html + `</optgroup></select>`;
}

// ---------- state ----------
// lines: {id, owner, tag, code}   weekly amount = amtDecode(code)
let state = defaultState();
function defaultState() {
  // split: 0 equal, 1 proportional to income, 2 custom (people[i].pct, whole percents summing to 100)
  return { period: 0, split: 0, people: [{ id: uid(), pct: 50 }, { id: uid(), pct: 50 }], incomes: [], expenses: [], goals: [] }; // goals: {id, owner, tag, code}
}
function uid() { return Math.random().toString(36).slice(2, 7); }
const pidx = p => state.people.findIndex(q => q.id === p.id);
const pname = p => COLOURS[pidx(p)][0];
const pcol = p => COLOURS[pidx(p)][1];
const lineAmt = it => amtDecode(it.code);
const setLineAmt = (it, weekly, isExp) => { it.code = amtEncode(weekly, isExp); };

// ---------- calc ----------
function periodDays() { return PERIODS[state.period][1]; }
const perPeriod = (it, days) => amtDecode(it.code) / 7 * days;

// whole-percent share per person, always summing to 100 (last person absorbs rounding)
function shares(r) {
  const ps = state.people, n = ps.length, out = {};
  let raw;
  if (state.split === 1) { const tot = ps.reduce((s, p) => s + r[p.id].income, 0); raw = ps.map(p => tot ? r[p.id].income / tot * 100 : 100 / n); }
  else if (state.split === 2) { const tot = ps.reduce((s, p) => s + (Number(p.pct) || 0), 0); raw = ps.map(p => tot ? (Number(p.pct) || 0) / tot * 100 : 100 / n); }
  else raw = ps.map(() => 100 / n);
  let acc = 0;
  ps.forEach((p, i) => { const v = i === n - 1 ? 100 - acc : Math.round(raw[i]); out[p.id] = v; acc += v; });
  return out;
}
// goal split within a bucket: whole percents summing to 100
function goalsOf(owner) { return state.goals.filter(g => g.owner === owner); }
function setGoalPct(id, val) {
  const g = state.goals.find(x => x.id === id), gs = goalsOf(g.owner), others = gs.filter(x => x !== g);
  val = Math.max(0, Math.min(100, Math.round(Number(val) || 0)));
  const rest = 100 - val, otot = others.reduce((s, x) => s + (Number(x.pct) || 0), 0);
  let acc = 0;
  others.forEach((x, i) => { const v = i === others.length - 1 ? rest - acc : Math.round(otot ? (Number(x.pct) || 0) / otot * rest : rest / others.length); x.pct = v; acc += v; });
  g.pct = val;
}
function setPct(id, val) {
  // set one person's share and rebalance the others proportionally so the total stays 100
  const ps = state.people, me = ps.find(p => p.id === id); val = Math.max(0, Math.min(100, Math.round(Number(val) || 0)));
  const others = ps.filter(p => p !== me), rest = 100 - val, otot = others.reduce((s, p) => s + (Number(p.pct) || 0), 0);
  let acc = 0;
  others.forEach((p, i) => { const v = i === others.length - 1 ? rest - acc : Math.round(otot ? (Number(p.pct) || 0) / otot * rest : rest / others.length); p.pct = v; acc += v; });
  me.pct = val;
}

function calc(days = periodDays()) {
  const r = {};
  for (const o of ['H', ...state.people.map(p => p.id)]) r[o] = { income: 0, expense: 0 };
  for (const i of state.incomes) if (r[i.owner]) r[i.owner].income += perPeriod(i, days);
  for (const e of state.expenses) if (r[e.owner]) r[e.owner].expense += perPeriod(e, days);

  // shared shortfall is split by the split rule; shared surplus stays in the household bucket
  const share = shares(r), h = r['H'], hNet = h.income - h.expense;
  const out = { days, rows: [], share };
  for (const p of state.people) {
    const me = r[p.id], take = hNet < 0 ? hNet * share[p.id] / 100 : 0;
    out.rows.push({ name: pname(p), colour: pcol(p), ...me, contribH: take, savings: me.income - me.expense + take });
  }
  // shared goals are funded from the shared surplus first, then from each person's savings
  const pool = Math.max(0, hNet) + out.rows.reduce((s, x) => s + Math.max(0, x.savings), 0);
  out.rows.push({ name: 'Household', ...h, contribH: 0, savings: Math.max(0, hNet), goalPool: pool, isH: true });
  const sum = k => out.rows.reduce((s, x) => s + x[k], 0);
  out.rows.push({ name: 'TOTAL', income: sum('income'), expense: sum('expense'), savings: sum('savings'), isTotal: true });
  return out;
}

// ---------- render ----------
const $ = s => document.querySelector(s);
const fmt = n => (n < 0 ? '-' : '') + Math.abs(n).toFixed(0).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
const cls = n => n < 0 ? 'neg' : 'pos';
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const sel = (f, opts, val) => `<select data-f="${f}">` + opts.map((o, i) => `<option value="${i}" ${i === val ? 'selected' : ''}>${esc(o)}</option>`).join('') + `</select>`;

function lineTable(kind, owner, items) {
  const isExp = kind === 'expenses', tags = isExp ? EXPENSE_TAGS : INCOME_TAGS, max = isExp ? MAX_EXP : MAX_INC;
  let html = `<table data-kind="${kind}" data-owner="${owner}"><tr><th>${isExp ? 'Expense' : 'Income'}</th><th class="w-amt">$/week</th><th class="w-conv">entered as</th><th class="w-del"></th></tr>`;
  for (const it of items) {
    html += `<tr data-id="${it.id}"><td><div class="tagcell">${groupIcon(tags, it.tag)}${tagSelect(tags, it.tag)}</div></td>
      <td><input type="number" data-f="amt" value="${lineAmt(it)}" min="0" max="${AMT_MAX}" step="${lineAmt(it) > 511 ? 10 : 1}"></td>
      <td>${sel('conv', CONV.map(f => f[0]), 0)}</td>
      <td><button type="button" data-act="del">x</button></td></tr>`;
  }
  return html + `<tr><td colspan="4">${items.length < max ? `<button type="button" data-act="add">+ ${isExp ? 'expense' : 'income'}</button>` : `<span class="small">max ${max}</span>`}</td></tr></table>`;
}

// Each goal receives exactly its split % of its bucket's weekly pool. 0% means nothing is allocated, ever.
// Personal goals draw on that person's savings. Shared goals draw on the shared surplus plus everyone's savings.
// Returns goal id -> weeks to reach (null = never).
function goalTimeline(cw) {
  const ps = state.people, rate = {};
  for (const r of cw.rows) if (!r.isTotal) rate[r.isH ? 'H' : ps.find(p => pname(p) === r.name).id] = Math.max(0, r.savings);
  const pool = { H: (rate['H'] || 0) + ps.reduce((s, p) => s + (rate[p.id] || 0), 0) };
  for (const p of ps) pool[p.id] = rate[p.id] || 0;
  const out = {};
  for (const g of state.goals) {
    const target = goalDecode(g.code), weekly = (pool[g.owner] || 0) * (Number(g.pct) || 0) / 100;
    out[g.id] = target <= 0 ? undefined : weekly > 0 ? Math.ceil(target / weekly - 1e-9) : null;
  }
  return out;
}

function goalTable(owner, items, timeline, funding) {
  let html = `<table data-kind="goals" data-owner="${owner}"><tr><th>Goal</th><th class="w-amt">Target $</th><th class="w-pct">Split %</th><th class="w-wk">Reached in</th><th class="w-del"></th></tr>`;
  for (const it of items) {
    const target = goalDecode(it.code), wk = timeline[it.id];
    html += `<tr data-id="${it.id}"><td><div class="tagcell">${groupIcon(GOAL_TAGS, it.tag)}${tagSelect(GOAL_TAGS, it.tag)}</div></td>
      <td><input type="number" data-f="goal" value="${target}" min="0" max="${GOAL_MAX}" step="${target > 5110 ? 100 : 10}"></td>
      <td><input type="number" data-f="gpct" value="${it.pct || 0}" min="0" max="100" step="1"></td>
      <td>${target === 0 ? '' : wk === null ? '<span class="neg">never</span>' : `${wk} wk (${(wk / 52.18).toFixed(1)} yr)`}</td>
      <td><button type="button" data-act="del">x</button></td></tr>`;
  }
  html += `<tr><td colspan="5">${items.length < MAX_GOAL ? `<button type="button" data-act="add">+ goal</button>` : `<span class="small">max ${MAX_GOAL}</span>`}</td></tr></table>`;
  if (funding) html += `<div class="small">Funded from: ${funding}</div>`;
  return html;
}
function splitTable(share) {
  const opts = [['Equal', 'Straight split between people'], ['Income', 'In proportion to each person\'s income'], ['Custom', 'Set each person\'s share']];
  let html = `<div class="splitopts">` + opts.map((o, i) => `<input type="radio" id="split${i}" name="split" value="${i}" ${state.split === i ? 'checked' : ''}><label for="split${i}"><b>${o[0]}</b></label><span class="small">${o[1]}</span>`).join('') + `</div>`;
  html += `<table><tr><th>Who</th><th class="w-amt">Share %</th></tr>`;
  for (const p of state.people) html += `<tr><td><span style="display:inline-block;width:12px;height:12px;background:${pcol(p)};vertical-align:middle"></span> ${pname(p)}</td>` +
    `<td><input type="number" data-f="pct" data-pid="${p.id}" min="0" max="100" step="1" value="${state.split === 2 ? p.pct : share[p.id]}" ${state.split === 2 ? '' : 'disabled'}></td></tr>`;
  return html + `</table>`;
}
const activeTab = {}; // owner id -> tab index (view state only). Shared: 0 split, 1 income, 2 expenses, 3 goals. People: 0 income, 1 expenses, 2 goals.

function render() {
  const c = calc(), cw = calc(7); // cards are always weekly; the forecast table follows the view period
  const timeline = goalTimeline(cw);
  $('#period').value = state.period;


  let html = '';
  for (const col of [{ id: 'H', name: 'Shared / Household' }, ...state.people.map(p => ({ ...p, name: pname(p) }))]) {
    const isH = col.id === 'H';
    const row = cw.rows.find(r => isH ? r.isH : r.name === col.name && !r.isH) || { income: 0, expense: 0, savings: 0 };
    html += `<div class="col" data-owner="${col.id}" style="border-color:${isH ? '#333' : pcol(col)}"><h3>` +
      (isH ? esc(col.name) : `<span style="display:inline-block;width:14px;height:14px;background:${pcol(col)};vertical-align:middle"></span> ${esc(col.name)} ` +
        `<button type="button" data-act="delPerson">x</button>`) + `</h3>` +
      `<div class="tabs">` + (isH ? ['Split', 'Income', 'Expenses', 'Goals'] : ['Income', 'Expenses', 'Goals']).map((t, i) => `<button type="button" data-tab="${i}" class="${(activeTab[col.id] || 0) === i ? 'on' : ''}">${t}</button>`).join('') + `</div><div class="sheet">` +
      [...(isH ? [splitTable(cw.share)] : []),
       lineTable('incomes', col.id, state.incomes.filter(i => i.owner === col.id)),
       lineTable('expenses', col.id, state.expenses.filter(e => e.owner === col.id)),
       goalTable(col.id, (state.goals || []).filter(g => g.owner === col.id), timeline,
         isH ? [`shared ${fmt(row.savings || 0)}`, ...cw.rows.filter(r => !r.isH && !r.isTotal).map(r => `${r.name} ${fmt(Math.max(0, r.savings))}`)].join(' + ') + ` = ${fmt(row.goalPool || 0)} /week` : null)][activeTab[col.id] || 0] +
      `</div><div class="summary">Income ${fmt(row.income)} &minus; expenses ${fmt(row.expense)} = <b class="${cls(row.income - row.expense)}">${fmt(row.income - row.expense)}</b> /week</div>` +
      (!isH && row.contribH ? `<div class="small">Share of household net: <span class="${cls(row.contribH)}">${fmt(row.contribH)}</span> /week</div>` : '') + `</div>`;
  }
  const track = $('#track'), idx = curIndex();
  track.innerHTML = html;
  track.scrollLeft = idx * track.clientWidth;
  updatePos();

  let f = `<tr><th>Bucket</th><th>Income</th><th>Expenses</th><th>Household share</th><th>Savings</th></tr>`;
  const per = `per ${PERIODS[state.period][0].toLowerCase()}`;
  for (const r of c.rows) f += `<tr${r.isTotal ? ' style="font-weight:bold"' : ''}><td${r.colour ? ` style="border-left:6px solid ${r.colour}"` : ''}>${esc(r.name)}</td><td>${fmt(r.income)}</td><td>${fmt(r.expense)}</td>` +
    `<td>${r.isTotal || r.isH ? '' : fmt(r.contribH)}</td><td class="${cls(r.savings)}">${fmt(r.savings)}</td></tr>`;
  $('#forecast').innerHTML = f + `<tr><td colspan="5" class="small">${per}</td></tr>`;
  updateLink();
}

// ---------- events ----------
document.body.addEventListener('input', e => {
  const t = e.target, f = t.dataset.f; if (!f) return;
  const tr = t.closest('tr'), table = t.closest('table'), kind = table.dataset.kind;
  const item = state[kind].find(x => x.id === tr.dataset.id); if (!item) return;
  if (f === 'amt' || f === 'goal' || f === 'gpct' || f === 'conv' || f === 'pct') return; // committed on change
  item[f] = Number(t.value);
  render();
});
document.body.addEventListener('change', e => {
  const t = e.target, f = t.dataset.f;
  if (t.name === 'split') { state.split = Number(t.value); render(); return; }
  if (f === 'pct') { setPct(t.dataset.pid, t.value); render(); return; }
  if (f === 'goal' || f === 'gpct') {
    const tr = t.closest('tr'), item = state.goals.find(x => x.id === tr.dataset.id); if (!item) return;
    if (f === 'goal') item.code = goalEncode(t.value); else setGoalPct(item.id, t.value);
    render(); return;
  }
  if (f === 'amt' || f === 'conv') {
    const tr = t.closest('tr'), table = t.closest('table'), kind = table.dataset.kind;
    const item = state[kind].find(x => x.id === tr.dataset.id); if (!item) return;
    // amount typed is interpreted at the "entered as" unit, converted to weekly, then snapped
    const raw = Number(tr.querySelector('[data-f=amt]').value) || 0, conv = CONV[Number(tr.querySelector('[data-f=conv]').value)][1];
    setLineAmt(item, raw / conv, kind === 'expenses'); delete item._raw;
    render();
  }
});

document.body.addEventListener('click', e => {
  if (e.target.dataset.tab !== undefined) { activeTab[e.target.closest('.col').dataset.owner] = Number(e.target.dataset.tab); render(); return; }
  const act = e.target.dataset.act; if (!act) return;
  if (act === 'add') {
    const table = e.target.closest('table');
    const kind = table.dataset.kind, owner = table.dataset.owner;
    state[kind].push({ id: uid(), owner, tag: 2, code: 0, pct: kind === 'goals' && goalsOf(owner).length === 0 ? 100 : 0 });
  } else if (act === 'del') {
    const table = e.target.closest('table'), tr = e.target.closest('tr'), kind = table.dataset.kind;
    const gone = state[kind].find(x => x.id === tr.dataset.id);
    state[kind] = state[kind].filter(x => x.id !== tr.dataset.id);
    if (kind === 'goals' && gone) { const gs = goalsOf(gone.owner); if (gs.length) setGoalPct(gs[0].id, (Number(gs[0].pct) || 0) + (Number(gone.pct) || 0)); }
  } else if (act === 'delPerson') {
    const id = e.target.closest('.col').dataset.owner;

    state.incomes = state.incomes.filter(i => i.owner !== id);
    state.expenses = state.expenses.filter(x => x.owner !== id);

});
const curIndex = () => { const t = $('#track'); return t.clientWidth ? Math.round(t.scrollLeft / t.clientWidth) : 0; };

$('#period').innerHTML = PERIODS.map((p, i) => `<option value="${i}">${p[0]}</option>`).join('');
$('#period').onchange = e => { state.period = Number(e.target.value); render(); };
$('#addPerson').onclick = () => { if (state.people.length >= MAX_PEOPLE) return alert(`Max ${MAX_PEOPLE} people`); state.people.push({ id: uid(), pct: 0 }); render(); };

// ---------- bit-packed serialisation ----------
// header: ver4 npeople-1 3 split2 [pct7 per person if custom]. Colours come from position. View period is not encoded.
// per owner (H, then people in order): ninc4, lines; nexp5, lines; ngoal3, goals (tag6 code10 pct7)
// line: tag6 code10 (scale1 + mantissa9) = 16 bits exactly
class BitWriter {
  constructor() { this.bits = []; }
  w(val, n) { for (let i = n - 1; i >= 0; i--) this.bits.push((val >> i) & 1); }
  bytes() { const out = new Uint8Array(Math.ceil(this.bits.length / 8)); this.bits.forEach((b, i) => { out[i >> 3] |= b << (7 - (i & 7)); }); return out; }
}
class BitReader {
  constructor(bytes) { this.b = bytes; this.p = 0; }
  r(n) { let v = 0; for (let i = 0; i < n; i++) { const byte = this.b[this.p >> 3] || 0; v = (v << 1) | ((byte >> (7 - (this.p & 7))) & 1); this.p++; } return v >>> 0; }
}
function encode(s) {
  const bw = new BitWriter();
  bw.w(VERSION, 4); bw.w(s.people.length - 1, 3); bw.w(s.split, 2);
  if (s.split === 2) for (const p of s.people) bw.w(Math.max(0, Math.min(100, Math.round(p.pct) || 0)), 7);
  const line = it => { bw.w(it.tag, 6); bw.w(it.code, 10); };
  for (const o of ['H', ...s.people.map(p => p.id)]) {
    const inc = s.incomes.filter(i => i.owner === o).slice(0, MAX_INC), exp = s.expenses.filter(e => e.owner === o).slice(0, MAX_EXP), goal = (s.goals || []).filter(g => g.owner === o).slice(0, MAX_GOAL);
    bw.w(inc.length, 4); inc.forEach(line); bw.w(exp.length, 5); exp.forEach(line);
    bw.w(goal.length, 3); goal.forEach(g => { line(g); bw.w(Math.max(0, Math.min(100, Math.round(g.pct) || 0)), 7); });
  }
  return bw.bytes();
}
function decode(bytes) {
  const br = new BitReader(bytes), s = {};
  const v = br.r(4); if (v !== VERSION) throw new Error('unknown version ' + v);
  s.period = viewPrefs().period;
  const np = br.r(3) + 1; s.people = []; s.split = br.r(2);
  for (let i = 0; i < np; i++) s.people.push({ id: uid(), pct: 0 });
  if (s.split === 2) for (const p of s.people) p.pct = br.r(7);
  else s.people.forEach((p, i) => { p.pct = i === np - 1 ? 100 - Math.floor(100 / np) * (np - 1) : Math.floor(100 / np); });
  s.incomes = []; s.expenses = []; s.goals = [];
  const line = owner => ({ id: uid(), owner, tag: br.r(6), code: br.r(10) });
  for (const o of ['H', ...s.people.map(p => p.id)]) {
    let n = br.r(4); for (let i = 0; i < n; i++) s.incomes.push(line(o));
    n = br.r(5); for (let i = 0; i < n; i++) s.expenses.push(line(o));
    n = br.r(3); for (let i = 0; i < n; i++) { const g = line(o); g.pct = br.r(7); s.goals.push(g); }
  }
  return s;
}
// base32 (uppercase, no padding) so the QR can use alphanumeric mode for the payload segment
const B32 = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ234567';
const b32 = {
  enc: bytes => { let bits = '', out = ''; for (const b of bytes) bits += b.toString(2).padStart(8, '0'); for (let i = 0; i < bits.length; i += 5) out += B32[parseInt(bits.slice(i, i + 5).padEnd(5, '0'), 2)]; return out; },
  dec: str => { let bits = ''; for (const c of str.toUpperCase()) { const v = B32.indexOf(c); if (v < 0) throw new Error('bad char ' + c); bits += v.toString(2).padStart(5, '0'); } const out = []; for (let i = 0; i + 8 <= bits.length; i += 8) out.push(parseInt(bits.slice(i, i + 8), 2)); return Uint8Array.from(out); },
};

let linkTimer;
function updateLink() {
  save();
  clearTimeout(linkTimer);
  linkTimer = setTimeout(() => {
    const enc = b32.enc(encode(state));
    history.replaceState(null, '', '#' + enc);
    const url = location.href, prefix = url.slice(0, url.indexOf('#') + 1);
    try {
      const qr = qrcode(0, 'L'); qr.addData(prefix, 'Byte'); qr.addData(enc, 'Alphanumeric'); qr.make();
      $('#qr').innerHTML = qr.createSvgTag({ cellSize: 6, margin: 2 });
    } catch (e) { $('#qr').innerHTML = `<span class="small">QR unavailable</span>`; }
  }, 150);
}
function save() { try { localStorage.setItem('budget13', JSON.stringify(state)); localStorage.setItem('viewPrefs', JSON.stringify({ period: state.period })); } catch {} }
function viewPrefs() { try { const p = JSON.parse(localStorage.getItem('viewPrefs')); return p && PERIODS[p.period] ? p : { period: 0 }; } catch { return { period: 0 }; } }

// ---------- diff ----------
function diff(a, b) {
  const out = [];
  if (a.people.length !== b.people.length) out.push(`people: ${a.people.length} → ${b.people.length}`);
  const splitName = s => ['equal', 'income', 'custom ' + s.people.map(p => p.pct + '%').join('/')][s.split || 0];
  if (splitName(a) !== splitName(b)) out.push(`split: ${splitName(a)} → ${splitName(b)}`);
  const n = Math.max(a.people.length, b.people.length);
  const ownerName = i => i === 0 ? 'Household' : (COLOURS[i - 1] ? COLOURS[i - 1][0] : `Person ${i}`);
  const lines = (s, kind, i) => { const o = i === 0 ? 'H' : (s.people[i - 1] || {}).id; return (s[kind] || []).filter(x => x.owner === o); };
  for (let i = 0; i <= n; i++) for (const kind of ['incomes', 'expenses', 'goals']) {
    const tags = { incomes: INCOME_TAGS, expenses: EXPENSE_TAGS, goals: GOAL_TAGS }[kind], la = lines(a, kind, i), lb = lines(b, kind, i);
    const label = x => kind === 'goals' ? `goal ${tags[x.tag][1]} $${goalDecode(x.code)} ${x.pct || 0}%` : `${tags[x.tag][1]} $${amtDecode(x.code)}/wk`;
    // match identical lines first, then pair leftovers by tag as "changed", rest are added/removed
    const key = x => x.tag + ':' + x.code + ':' + (x.pct || 0);
    const pool = new Map(); for (const y of lb) pool.set(key(y), (pool.get(key(y)) || 0) + 1);
    const rem = [], add = [];
    for (const x of la) { const k = key(x); if (pool.get(k)) pool.set(k, pool.get(k) - 1); else rem.push(x); }
    // rebuild adds: everything in lb not consumed by a match
    const consumed = new Map(); for (const x of la) { const k = key(x); if (!rem.includes(x)) consumed.set(k, (consumed.get(k) || 0) + 1); }
    for (const y of lb) { const k = key(y); if (consumed.get(k)) consumed.set(k, consumed.get(k) - 1); else add.push(y); }
    for (const x of rem) { const j = add.findIndex(y => y.tag === x.tag); if (j >= 0) { out.push(`${ownerName(i)}: ${label(x)} → ${label(add[j])}`); add.splice(j, 1); } else out.push(`${ownerName(i)}: − ${label(x)}`); }
    for (const y of add) out.push(`${ownerName(i)}: + ${label(y)}`);
  }
  return out;
}
function showIncoming(local, incoming, hash) {
  const d = diff(local, incoming), box = $('#incoming');
  box.innerHTML = `<b>Incoming link differs from your saved budget</b> (${d.length} change${d.length === 1 ? '' : 's'}):<br>` +
    d.map(esc).join('<br>') + `<br><button type="button" id="takeTheirs">Take theirs</button> <button type="button" id="keepMine">Keep mine</button>`;
  box.hidden = false;
  $('#takeTheirs').onclick = () => { state = incoming; box.innerHTML = `<b>Loaded incoming link.</b> Changes from your previous version:<br>` + d.map(esc).join('<br>') + `<br><button type="button" id="dismiss">Dismiss</button>`; $('#dismiss').onclick = () => { box.hidden = true; }; render(); };
  $('#keepMine').onclick = () => { box.hidden = true; state = local; render(); };
  state = local; render();
}

function load() {
  const hash = location.hash.slice(1);
  let local = null;
  try { const s = localStorage.getItem('budget13'); if (s) local = JSON.parse(s); } catch {}
  if (hash) {
    let incoming;
    try { incoming = decode(b32.dec(hash)); } catch (e) { alert('Could not read budget from link: ' + e.message); incoming = null; }
    if (incoming) {
      if (local && b32.enc(encode(local)) !== hash) { showIncoming(local, incoming, hash); return; }
      state = incoming; return;
    }
  }
  if (local) { state = local; return; }
  state = defaultState();
  const [m, c] = state.people.map(p => p.id);
  const inc = (owner, tag, amt) => state.incomes.push({ id: uid(), owner, tag: tagIndex(INCOME_TAGS, tag), code: amtEncode(amt, false) });
  const exp = (owner, tag, amt) => state.expenses.push({ id: uid(), owner, tag: tagIndex(EXPENSE_TAGS, tag), code: amtEncode(amt, true) });
  inc(m, 'Salary', 800); inc(c, 'Salary', 2076.88);
  exp('H', 'Groceries', 75); exp('H', 'Electricity', 65); exp('H', 'Water', 0); exp('H', 'Internet', 11.25); exp('H', 'Buffer', 20);
  exp(m, 'Rent', 180); exp(m, 'Gym', 19); exp(m, 'Dance classes', 60); exp(m, 'Streaming', 5); exp(m, 'Pharmacy', 20); exp(m, 'Travel savings', 60); exp(m, 'Public transport', 60); exp(m, 'Fun money', 75);
  state.goals.push({ id: uid(), owner: m, tag: tagIndex(GOAL_TAGS, 'Holiday'), code: goalEncode(4000), pct: 100 });
  state.goals.push({ id: uid(), owner: c, tag: tagIndex(GOAL_TAGS, 'Holiday'), code: goalEncode(6000), pct: 100 });
  exp(c, 'Rent', 300); exp(c, 'Gym', 20); exp(c, 'Fuel', 100); exp(c, 'Streaming', 5); exp(c, 'Pharmacy', 5); exp(c, 'Health insurance', 45); exp(c, 'AI tools', 25); exp(c, 'Fun money', 75);
}
// hashchange fires when a link is pasted into this tab; our own replaceState does not trigger it
window.addEventListener('hashchange', () => { load(); if ($('#incoming').hidden) render(); });
load(); if ($('#incoming').hidden) render();
